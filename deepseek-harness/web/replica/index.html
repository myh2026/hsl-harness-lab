<!doctype html>
<!--
  DSH web shell — HSL 复现版视觉复刻（vanilla，无构建步骤）。

  本页是 deepseek-harness（https://github.com/deepseek-ai/deepseek-harness，MIT）
  apps/web 前端壳的忠实视觉重绘：配色/圆角/边框/字体全部取自原仓库
  packages/client/ui-theme 的 --dsw-* 设计令牌（design-platform.css /
  gradient-shadow-text.css / base.css），布局度量取自 ui-layout AppFrame、
  ui-sidebar SidebarRoot、ui-conversation ConversationRoot / InputBar、
  ui-chat ChatView / MessageItem、ui-tool ToolRow / DisclosureRow 的 CSS。

  原版 web/ 壳的逐字拷贝在 ../shell/（只读）。本目录是重绘复刻 + server.ts 适配层。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="color-scheme" content="light dark" />
    <title>DSH Local Build · HSL 复现</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <!-- ===== 框架无关 boot 页（ui-web boot-page.ts 的复刻）===== -->
    <div id="boot" class="boot" data-dsh-boot>
      <div class="bootCard">
        <div class="bootWordmark">HARNESS</div>
        <div class="bootSpinner" data-dsh-boot-spinner></div>
        <div class="bootHint">Loading plugins…</div>
      </div>
    </div>

    <!-- ===== 主界面（AppFrame: sidebar | center）===== -->
    <div id="app" class="frame" hidden>
      <!-- 侧栏列（AppFrame.sidebarCol + SidebarRoot） -->
      <div class="sidebarCol">
        <aside class="sidebarRoot" id="sidebarRoot">
          <div class="logoRow">
            <button type="button" class="brand" id="brandBtn" aria-label="新建会话">
              <span class="brandIdentity" aria-hidden="true">
                <span class="brandMark">

.46881 12.8445 7.55182 13.126C7.63882 13.404 7.75182 13.5955 7.91033 13.8396C8.01983 14.0011 8.09533 14.2411 7.80083 14.4216C7.15181 14.8231 6.02327 14.2866 5.97027 14.2601C4.65673 13.4865 3.5587 12.4655 2.78467 11.069C2.03715 9.72493 1.60314 8.28289 1.53164 6.74384C1.51264 6.37233 1.62214 6.24082 1.99215 6.17332C2.47916 6.08332 2.98118 6.06432 3.46769 6.13582C5.52476 6.43633 7.27581 7.35586 8.74385 8.8129C9.58188 9.64243 10.2159 10.634 10.8689 11.6025C11.5634 12.631 12.3105 13.611 13.262 14.4146C13.598 14.6961 13.866 14.9101 14.1225 15.0681C13.349 15.1546 12.058 15.1731 11.1749 14.4746L11.1749 14.4736ZM12.141 8.25988C12.141 8.09488 12.273 7.96338 12.439 7.96338C12.4765 7.96338 12.5105 7.97088 12.541 7.98188C12.5825 7.99688 12.6205 8.01938 12.6505 8.05338C12.7035 8.10588 12.7335 8.18088 12.7335 8.25988C12.7335 8.42489 12.6015 8.55639 12.4355 8.55639C12.2695 8.55639 12.141 8.42489 12.141 8.25988ZM15.1415 9.79893C14.949 9.87793 14.7565 9.94544 14.5715 9.95294C14.2845 9.96794 13.9715 9.85143 13.8015 9.70893C13.5375 9.48742 13.3485 9.36342 13.2695 8.97691C13.2355 8.8119 13.2545 8.55639 13.2845 8.40989C13.3525 8.09438 13.277 7.89187 13.0545 7.70787C12.8735 7.55786 12.6435 7.51636 12.39 7.51636C12.2955 7.51636 12.209 7.47486 12.1445 7.44136C12.039 7.38886 11.9519 7.25735 12.035 7.09585C12.0615 7.04335 12.19 6.91584 12.22 6.89334C12.5635 6.69784 12.959 6.76184 13.326 6.90834C13.6655 7.04735 13.922 7.30236 14.292 7.66287C14.6695 8.09838 14.7375 8.21838 14.9525 8.54539C15.1225 8.8009 15.277 9.06341 15.3831 9.36392C15.4471 9.55142 15.3641 9.70493 15.1415 9.79893Z" fill="currentColor"/></svg>
                </span>
                <span class="brandName">
                  <span class="fallbackBrandName">DSH Local Build</span>
                </span>
              </span>
            </button>
            <button type="button" class="iconButton toggle" id="toggleSidebarBtn" aria-label="收起侧边栏">
              <svg class="panelIcon" viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2.25" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 2.75v10.5" stroke="currentColor" stroke-width="1.5"/></svg>
              <span class="railMark" aria-hidden="true"></span>
            </button>
          </div>

          <button type="button" class="newSession" id="newSessionBtn" aria-label="新建会话">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M3 4.25A2.25 2.25 0 0 1 5.25 2h5.5A2.25 2.25 0 0 1 13 4.25v4.5A2.25 2.25 0 0 1 10.75 11h-5.5c-.35 0-.68.06-1 .18v.82a2 2 0 0 1-2-2V4.25Z" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v3M6.5 6.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span class="newSessionLabel">新会话</span>
          </button>

          <div class="regionArea">
            <div class="tree">
              <div class="projectRow">
                <span class="slot">
                  <svg class="folder" viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M1.75 4.75c0-.55.45-1 1-1h3.1l1.4 1.6h5c.55 0 1 .45 1 1v5.4c0 .55-.45 1-1 1H2.75c-.55 0-1-.45-1-1V4.75Z" stroke="currentColor" stroke-width="1.3"/></svg>
                </span>
                <span class="projectText"><span class="title">deepseek-harness</span></span>
              </div>
              <div class="sessionList" id="sessionList"></div>
            </div>
          </div>

          <div class="footArea">
            <div class="footerActions">
              <button type="button" class="footRow" id="themeToggleBtn" aria-label="切换深浅主题">
                <span class="footIcon">
                  <svg id="themeIconMoon" viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3c0-.5.07-1 .2-1.45A5.5 5.5 0 1 0 13 9.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                  <svg id="themeIconSun" viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true" hidden><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.4M8 13.1v1.4M1.5 8h1.4M13.1 8h1.4M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                </span>
                <span class="footLabel" id="themeToggleLabel">深色模式</span>
              </button>
            </div>
            <div class="settingsArea">
              <button type="button" class="footRow" disabled title="设置面板未复刻（见 web/README.md）">
                <span class="footIcon">
                  <svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                </span>
                <span class="footLabel">设置</span>
              </button>
            </div>
            <!-- 署名：原项目 MIT -->
            <footer class="attribution">
              <a href="https://github.com/deepseek-ai/deepseek-harness" target="_blank" rel="noopener">deepseek-harness · MIT</a>
              <span class="attributionSep">·</span>
              <a href="https://github.com/deepseek-ai/deepseek-harness" target="_blank" rel="noopener">HSL 复现视觉重绘</a>
            </footer>
          </div>
        </aside>
      </div>

      <!-- 中列（ConversationRoot） -->
      <div class="centerCol">
        <div class="conversation" id="conversationRoot">
          <header class="header">
            <div class="titleRow">
              <div class="titleCluster">
                <nav class="crumbs" aria-label="会话路径">
                  <span class="crumb crumbCurrent" id="sessionTitleCrumb">新会话</span>
                </nav>
              </div>
              <div class="headerActions">
                <span class="replicaBadge" title="本页为 HSL 复现版 DSH web shell 的视觉复刻：UI 依据原仓库设计令牌重绘，后端经 dhv-ts 解释器跑 dsh.hsl 剧本">HSL 复现 · 视觉复刻</span>
              </div>
            </div>
          </header>

          <div class="body">
            <div class="scrollBody" id="scrollBody">
              <main class="chatView">
                <div class="chatScroll" id="chatScroll">
                  <div class="column" id="messageColumn" aria-live="polite"></div>
                </div>
              </main>

              <div class="composerSeat">
                <div class="composerStack" id="composerStack">
                  <div class="heroChrome" id="heroChrome" aria-hidden="true">
                    <svg class="fishLogo" width="24" height="17.66" viewBox="0 0 23.16 17.04" fill="none"><path d="M22.9168 1.43018C22.6713 1.31018 22.5658 1.53918 22.4223 1.65519C22.3733 1.69269 22.3318 1.74169 22.2903 1.78669C21.9317 2.1697 21.5127 2.42121 20.9657 2.39121C20.1657 2.34621 19.4827 2.59771 18.8787 3.20973C18.7502 2.45521 18.3236 2.0047 17.6746 1.71569C17.3351 1.56568 16.9916 1.41518 16.7536 1.08867C16.5876 0.856163 16.5421 0.597155 16.4591 0.341647C16.4061 0.187643 16.3536 0.0301382 16.1761 0.00363739C15.9836 -0.0263635 15.9081 0.135141 15.8326 0.270145C15.5306 0.822162 15.4136 1.43018 15.4251 2.0462C15.4516 3.43174 16.0366 4.53527 17.1991 5.3203C17.3311 5.4103 17.3651 5.5003 17.3236 5.63181C17.2441 5.90231 17.1501 6.16482 17.0671 6.43533C17.0141 6.60784 16.9351 6.64584 16.7501 6.57033C16.1121 6.30383 15.5611 5.90931 15.074 5.4328C14.2475 4.63328 13.5 3.75075 12.568 3.05973C12.349 2.89822 12.13 2.74822 11.9034 2.60522C10.9524 1.68169 12.028 0.923165 12.277 0.833162C12.5375 0.739159 12.3675 0.41615 11.5259 0.42015C10.6844 0.42365 9.91439 0.705658 8.93286 1.08117C8.78935 1.13767 8.63835 1.17867 8.48384 1.21267C7.59332 1.04367 6.66829 1.00617 5.70226 1.11517C3.88321 1.31768 2.43016 2.1777 1.36213 3.64575C0.0790928 5.4103 -0.222916 7.41536 0.146595 9.50642C0.535106 11.7105 1.66014 13.535 3.38869 14.9616C5.18125 16.4406 7.24581 17.1657 9.60138 17.0266C11.0319 16.9441 12.6245 16.7526 14.421 15.2321C14.874 15.4576 15.3496 15.5476 16.1381 15.6151C16.7456 15.6716 17.3306 15.5851 17.7836 15.4911C18.4931 15.3411 18.4441 14.6841 18.1876 14.5636C16.1081 13.595 16.5646 13.9891 16.1496 13.67C17.2061 12.42 18.8202 10.1979 19.3182 7.17235C19.3672 6.83834 19.4297 6.36783 19.4222 6.09732C19.4182 5.93231 19.4562 5.86831 19.6447 5.84931C20.1657 5.78931 20.6712 5.64681 21.1357 5.3913C22.4833 4.65528 23.0268 3.44624 23.1548 1.9972C23.1738 1.77569 23.1508 1.54668 22.9168 1.43018Z" fill="currentColor"/></svg>
                  </div>

                  <div class="inputBar">
                    <div class="card">
                      <div class="cardScroll">
                        <div class="grow">
                          <textarea id="composerInput" class="input" rows="1"
                            placeholder="发消息或做任务… / 调用指令 @ 文件或对话"
                            aria-label="消息输入框"></textarea>
                        </div>
                      </div>
                      <div class="cardRow">
                        <div class="tools">
                          <button type="button" class="add" disabled title="附件（未复刻）" aria-label="添加附件">
                            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M8 3.25v9.5M3.25 8h9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                          </button>
                        </div>
                        <div class="trailing">
                          <select class="select" id="modelSelect" aria-label="模型选择">
                            <option value="scripted">scripted · fix-variance</option>
                          </select>
                          <button type="button" class="primary" id="sendBtn" disabled aria-label="发送消息">
                            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8.3125 0.980183C8.66767 1.0531 8.97902 1.20418 9.2627 1.43233C9.48724 1.61297 9.73029 1.85793 9.97949 2.10714L14.707 6.83468L13.293 8.24874L9 3.95577V15.0417H7V3.95577L2.70703 8.24874L1.29297 6.83468L6.02051 2.10714C6.26971 1.85793 6.51277 1.61297 6.7373 1.43233C6.97662 1.23986 7.28445 1.04402 7.6875 0.980183C7.8973 0.947006 8.1031 0.95516 8.3125 0.980183Z" fill="currentColor"/></svg>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
